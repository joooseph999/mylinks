<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的主页</title>
  <style>
    /* ===== 全局样式 ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a0000 0%, #8b0000 50%, #1a0000 100%);
      font-family: 'Segoe UI', sans-serif;
    }

    /* ===== 卡片容器 ===== */
    .card {
      background: white;
      border-radius: 24px;
      padding: 40px 32px;
      width: 360px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
    }

    /* ===== 头像 ===== */
    .avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, #8b0000, #cc0000);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      margin: 0 auto 16px;
    }

    /* ===== 名字和简介 ===== */
    .name {
      font-size: 22px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 6px;
    }

    .bio {
      font-size: 14px;
      color: #666;
      margin-bottom: 28px;
      line-height: 1.6;
    }

    /* ===== 链接按钮 ===== */
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-btn {
      display: block;
      padding: 14px 20px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      color: white;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .link-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    }

    .link-btn:active {
      transform: translateY(0px);
    }

    /* 不同按钮颜色 */
    .btn-purple { background: linear-gradient(135deg, #667eea, #764ba2); }
    .btn-pink   { background: linear-gradient(135deg, #f093fb, #f5576c); }
    .btn-blue   { background: linear-gradient(135deg, #4facfe, #00f2fe); }
    .btn-green  { background: linear-gradient(135deg, #43e97b, #38f9d7); }

    /* ===== 底部版权 ===== */
    .footer {
      margin-top: 24px;
      font-size: 12px;
      color: #bbb;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- 头像 -->
    <div class="avatar">🐯</div>

    <!-- 名字和简介 -->
    <div class="name">KAI</div>
    <div class="bio">简单介绍一下自己 ✨<br>比如：设计师 / 学生 / 创作者</div>

    <!-- 链接列表 -->
    <div class="links">
      <a href="#" class="link-btn btn-purple">🐦 微博</a>
      <a href="#" class="link-btn btn-pink">📸 小红书</a>
      <a href="#" class="link-btn btn-blue">💬 微信公众号</a>
      <a href="#" class="link-btn btn-green">✉️ 联系我</a>
    </div>

    <div class="footer">made with ❤️</div>
  </div>

</body>
</html>
